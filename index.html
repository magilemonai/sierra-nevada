<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lighthouse of Meridia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#aaa;font-family:'Press Start 2P','Courier New',monospace;font-size:11px;line-height:1.6;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;overflow-y:auto;overflow-x:hidden;padding:10px 0}
#game-container{width:644px;max-width:100%;border:2px solid #5555FF;background:#000;box-shadow:0 0 30px rgba(85,85,255,0.3)}
#title-bar{background:#0000AA;color:#FFFF55;padding:4px 8px;font-size:9px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #5555FF}
#scene-wrapper{position:relative;width:100%;aspect-ratio:640/400;border-bottom:2px solid #5555FF;overflow:hidden}
#game-canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;display:block}
#room-name{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#55FFFF;padding:2px 10px;font-size:9px;letter-spacing:1px;border:1px solid #00AAAA;font-family:'Press Start 2P','Courier New',monospace}
#inventory-bar{background:#0000AA;border-bottom:2px solid #5555FF;padding:4px 8px;min-height:24px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:8px;color:#55FF55}
#text-output{height:160px;overflow-y:auto;padding:8px;background:#000;border-bottom:2px solid #5555FF;font-size:10px}
#text-output::-webkit-scrollbar{width:8px}
#text-output::-webkit-scrollbar-track{background:#000}
#text-output::-webkit-scrollbar-thumb{background:#555;border:1px solid #0000AA}
#text-output p{margin-bottom:6px;word-wrap:break-word}
.narration{color:#AAAAAA} .system{color:#55FFFF} .error{color:#FF5555} .success{color:#55FF55}
.input-echo{color:#FFFF55} .score-msg{color:#FF55FF} .victory{color:#FFFF55;text-align:center} .lore{color:#FF55FF}
#input-area{display:flex;align-items:center;padding:6px 8px;background:#000055}
#input-prompt{color:#55FF55;margin-right:6px;font-size:11px}
#text-input{flex:1;background:transparent;border:none;color:#FFF;font-family:'Press Start 2P','Courier New',monospace;font-size:11px;outline:none;caret-color:#55FF55}
#text-input::placeholder{color:#555}
@media(max-width:480px){
  body{font-size:9px;padding:0}
  #game-container{border:none;box-shadow:none}
  #title-bar{font-size:7px;padding:2px 4px}
  #inventory-bar{font-size:7px;padding:2px 4px}
  #text-output{height:120px;font-size:8px;padding:4px}
  #text-input{font-size:9px}
  #input-prompt{font-size:9px}
  #room-name{font-size:7px}
}
</style>
</head>
<body>
<div id="game-container">
<div id="title-bar">
<span class="game-title">THE LIGHTHOUSE OF MERIDIA</span>
<span id="score-display" role="status" aria-label="Score display">Score: 0/100 | Turns: 0</span>
</div>
<div id="scene-wrapper">
<canvas id="game-canvas" width="320" height="200" role="img" aria-label="Game scene illustration"></canvas>
<div id="room-name"></div>
</div>
<div id="inventory-bar">Inventory: (empty)</div>
<div id="text-output" role="log" aria-live="polite" aria-label="Game text output"></div>
<div id="input-area">
<span id="input-prompt">&gt;</span>
<input type="text" id="text-input" placeholder="Type a command..." autocomplete="off" autofocus>
</div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════
// EGA PALETTE
// ═══════════════════════════════════════════════════════════════════
const EGA = {
  BLACK:'#000000',BLUE:'#0000AA',GREEN:'#00AA00',CYAN:'#00AAAA',
  RED:'#AA0000',MAGENTA:'#AA00AA',BROWN:'#AA5500',LTGRAY:'#AAAAAA',
  DKGRAY:'#555555',LTBLUE:'#5555FF',LTGREEN:'#55FF55',LTCYAN:'#55FFFF',
  LTRED:'#FF5555',LTMAGENTA:'#FF55FF',YELLOW:'#FFFF55',WHITE:'#FFFFFF'
};

// ═══════════════════════════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════════════════════════
const VERB_SYNONYMS = {
  look:['look','examine','inspect','l','x'],take:['take','get','grab','pick'],
  use:['use','put','place'],go:['go','walk','move'],talk:['talk','speak','ask'],
  open:['open'],read:['read'],tie:['tie','attach'],light:['light','ignite'],
  pour:['pour','fill'],unlock:['unlock'],search:['search','look in','check'],
  answer:['answer','say','type'],push:['push'],pull:['pull'],eat:['eat','taste'],
  swim:['swim'],climb:['climb'],save:['save'],load:['load','restore'],restart:['restart'],drop:['drop'],cut:['cut','chop','hack'],
  give:['give','feed'],pet:['pet','touch','stroke'],jump:['jump','leap']
};
const VERB_LOOKUP = {};
Object.keys(VERB_SYNONYMS).forEach(c => VERB_SYNONYMS[c].forEach(w => VERB_LOOKUP[w]=c));
const DIR_MAP = {n:'north',s:'south',e:'east',w:'west',u:'up',d:'down',
  north:'north',south:'south',east:'east',west:'west',up:'up',down:'down',enter:'enter',in:'enter'};
const PREPS = ['on','to','in','with','at','from','into','across','over'];

const state = {
  currentRoom: null, inventory: [], score: 0, turns: 0, scored: {},
  flags: {vines_cleared:false,lamp_lit:false,well_bridged:false,temple_open:false,
    rope_tied:false,lighthouse_unlocked:false,lens_placed:false,oil_poured:false,
    lighthouse_lit:false,hut_searched:false,journal_read:false,parrot_fed:false,fruit_eaten:false}
};

let canvas, ctx, outputEl, inputEl, roomNameEl;

function addText(text, cls) {
  const p = document.createElement('p');
  if(cls) p.className = cls;
  // Highlight CAPITALIZED interactive words in narration/default text (safe DOM approach)
  if((!cls || cls==='narration') && text && /\b[A-Z]{2,}\b/.test(text)){
    const parts = text.split(/(\b[A-Z]{2,}\b)/g);
    parts.forEach(part => {
      const DIR_WORDS = ['NORTH','SOUTH','EAST','WEST','UP','DOWN','AND','THE','BUT','YOU','OR','IT','IS','IF','AN','TO','IN','ON','OF','AT','BY','NO'];
      if(/^[A-Z]{2,}$/.test(part) && !DIR_WORDS.includes(part)){
        const span = document.createElement('span');
        span.style.color = '#55FFFF';
        span.textContent = part;
        p.appendChild(span);
      } else {
        p.appendChild(document.createTextNode(part));
      }
    });
  } else {
    p.textContent = text;
  }
  outputEl.appendChild(p);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function addScore(pts, reason) {
  if(state.scored[reason]) return;
  state.scored[reason] = true;
  state.score += pts;
  addText('[Score +'+pts+': '+reason+']  (Total: '+state.score+'/100)', 'system');
  document.getElementById('score-display').textContent = 'Score: '+state.score+'/100 | Turns: '+state.turns;
  playSuccess();
}

function addItem(id) { if(!state.inventory.includes(id)){state.inventory.push(id);updateInv();playPickup();} }
function removeItem(id) { state.inventory=state.inventory.filter(x=>x!==id);updateInv(); }
function hasItem(id) { return state.inventory.includes(id); }

const ITEM_NAMES = {
  plank:'Wooden Plank',rope:'Sturdy Rope',oil_lamp:'Oil Lamp',machete:'Rusty Machete',
  bucket:'Old Bucket',rusty_key:'Rusty Key',flint:'Flint & Steel',oil_flask:'Flask of Oil',
  crystal_lens:'Crystal Lens',exotic_fruit:'Exotic Fruit'
};

function updateInv() {
  const el = document.getElementById('inventory-bar');
  if(state.inventory.length===0) el.textContent='Inventory: (empty)';
  else el.textContent='Inventory: '+state.inventory.map(id=>ITEM_NAMES[id]||id).join(', ');
}

function updateScore() {
  document.getElementById('score-display').textContent='Score: '+state.score+'/100 | Turns: '+state.turns;
}

// Audio
let audioCtx;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playBeep(f,d){try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.06;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime);o.stop(ac.currentTime+d/1000);}catch(e){}}
function playSuccess(){try{const ac=getAC();[440,554,659,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.06;g.gain.setValueAtTime(0.06,ac.currentTime+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.12+0.15);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.12);o.stop(ac.currentTime+i*0.12+0.15);});}catch(e){}}
function playError(){try{const ac=getAC();[330,220].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=0.04;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.15);o.stop(ac.currentTime+i*0.15+0.2);});}catch(e){}}
function playPickup(){try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(660,ac.currentTime);o.frequency.exponentialRampToValueAtTime(1320,ac.currentTime+0.08);g.gain.value=0.06;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime);o.stop(ac.currentTime+0.12);}catch(e){}}
// Ambient ocean sound (subtle noise + low oscillator)
let ambientStarted=false;
function startAmbient(){
  if(ambientStarted)return;ambientStarted=true;
  try{
    const ac=getAC();
    // Brown noise for ocean rumble
    const bufSize=2*ac.sampleRate,buf=ac.createBuffer(1,bufSize,ac.sampleRate),data=buf.getChannelData(0);
    let last=0;for(let i=0;i<bufSize;i++){const white=Math.random()*2-1;last=(last+(0.02*white))/1.02;data[i]=last*3.5;}
    const src=ac.createBufferSource(),g=ac.createGain();
    src.buffer=buf;src.loop=true;g.gain.value=0.03;
    src.connect(g);g.connect(ac.destination);src.start();
  }catch(e){}
}
function playVictoryFanfare(){try{const ac=getAC();[523,659,784,1047,784,1047,1319].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.07;g.gain.setValueAtTime(0.07,ac.currentTime+i*0.2);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.2+0.25);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*0.2);o.stop(ac.currentTime+i*0.2+0.25);});}catch(e){}}

function parseInput(raw) {
  const input = raw.trim().toLowerCase();
  if(!input) return null;
  if(input==='i'||input==='inventory') return {verb:'inventory',noun:null,prep:null,noun2:null};
  if(input==='help') return {verb:'help',noun:null,prep:null,noun2:null};
  if(DIR_MAP[input]) return {verb:'go',noun:DIR_MAP[input],prep:null,noun2:null};
  // Handle direct riddle answer "map" only at temple, otherwise show map
  if(input==='map'){
    if(state.currentRoom==='temple_exterior') return {verb:'answer',noun:'map',prep:null,noun2:null};
    return {verb:'map',noun:null,prep:null,noun2:null};
  }
  let tokens = input.split(/\s+/);
  if(tokens.length>=2&&tokens[0]==='pick'&&tokens[1]==='up'){tokens.splice(0,2,'take');}
  if(tokens.length>=2&&tokens[0]==='look'&&(tokens[1]==='in'||tokens[1]==='inside')){tokens.splice(0,2,'search');}
  if(tokens.length>=2&&tokens[0]==='climb'&&tokens[1]==='down'){return{verb:'go',noun:'down',prep:null,noun2:null};}
  if(tokens.length>=2&&tokens[0]==='climb'&&tokens[1]==='up'){return{verb:'go',noun:'up',prep:null,noun2:null};}
  let verbWord = tokens[0];
  let verb = VERB_LOOKUP[verbWord]||verbWord;
  if(DIR_MAP[verb]) return {verb:'go',noun:DIR_MAP[verb],prep:null,noun2:null};
  let rest = tokens.slice(1);
  if((verb==='look'||verb==='examine')&&rest.length>0&&rest[0]==='at') rest=rest.slice(1);
  if(verb==='look'&&rest.length===0) return {verb:'look',noun:null,prep:null,noun2:null};
  // Find preposition
  let prep=null,noun=null,noun2=null,pi=-1;
  for(let i=0;i<rest.length;i++){if(PREPS.includes(rest[i])){pi=i;prep=rest[i];break;}}
  if(pi>-1){noun=rest.slice(0,pi).join(' ')||null;noun2=rest.slice(pi+1).join(' ')||null;}
  else{noun=rest.join(' ')||null;}
  if(verb==='go'&&noun&&DIR_MAP[noun])noun=DIR_MAP[noun];
  // Handle "go into X" / "go in X" where prep splits noun to null
  if(verb==='go'&&!noun&&noun2&&(prep==='into'||prep==='in'||prep==='to')){noun='enter';prep=null;noun2=null;}
  return {verb,noun,prep,noun2};
}

function moveToRoom(roomId) {
  if(!ROOMS[roomId]){addText("You can't go that way.",'error');playError();return;}
  state.currentRoom = roomId;
  const room = ROOMS[roomId];
  roomNameEl.textContent = room.name;
  addText('');
  addText('\u2014 '+room.name+' \u2014','narration');
  addText(room.getDescription(),'narration');
  drawCurrentScene();
}

function drawCurrentScene() {
  if(SCENES[state.currentRoom]) {
    ctx.imageSmoothingEnabled = false;
    SCENES[state.currentRoom](ctx, 320, 200, state);
  }
}

function redrawScene() { drawCurrentScene(); }

// Sierra-style death with automatic mercy rewind
function sierraDeath(deathText, tip) {
  addText('','error');
  addText(deathText,'error');
  addText('','error');
  addText('Oh dear, you have died!','error');
  if(tip) addText(tip,'system');
  addText('','system');
  addText('...But fate is kind. You snap back to reality, heart pounding, realizing you only imagined that terrible outcome. Perhaps try something else.','narration');
  playError();
}

function processCommand(raw) {
  const cmd = parseInput(raw);
  if(!cmd) return;
  state.turns++;
  updateScore();
  addText('> '+raw.trim(),'input-echo');

  if(cmd.verb==='inventory'){
    if(state.inventory.length===0) addText('You are not carrying anything.');
    else { addText('You are carrying:'); state.inventory.forEach(id=>addText('  - '+(ITEM_NAMES[id]||id))); }
    return;
  }
  if(cmd.verb==='help'){
    addText('--- COMMANDS ---','system');
    addText('LOOK / EXAMINE [object]  - Inspect surroundings or an object','system');
    addText('TAKE / GET [item]        - Pick up an item','system');
    addText('USE [item] ON [target]   - Use an item with something','system');
    addText('  Example: USE PLANK ON WELL, USE KEY ON DOOR','system');
    addText('GO [N/S/E/W/U/D]        - Move in a direction','system');
    addText('SEARCH [place]           - Search a location','system');
    addText('ANSWER [guess]           - Answer a riddle or puzzle','system');
    addText('TALK / OPEN / TIE / CUT / LIGHT / POUR / READ','system');
    addText('EAT / GIVE / PET / SWIM / CLIMB','system');
    addText('INVENTORY (I) - Check items  |  SAVE / LOAD - Save or load game','system');
    addText('MAP - View island map  |  RESTART - Start over','system');
    return;
  }
  if((cmd.noun==='map'&&cmd.verb==='look')||cmd.verb==='map'){
    addText('=== ISLE OF MERIDIA ===','system');
    addText('','system');
    addText('            [Temple Interior]','system');
    addText('                  |','system');
    addText('[Cave]--[Coastal Path]--[Jungle]--[Temple]','system');
    addText('              |                      |','system');
    addText('          [Beach]             [Cliff Overlook]','system');
    addText('                                     |','system');
    addText('[Hidden Cove]----[Lighthouse Base]---+','system');
    addText('                       |','system');
    addText('                [Lighthouse Top]','system');
    addText('','system');
    const rm = state.currentRoom.replace(/_/g,' ');
    addText('You are at: '+rm.charAt(0).toUpperCase()+rm.slice(1),'narration');
    return;
  }
  if(cmd.verb==='restart'){
    state.currentRoom=null;state.inventory=[];state.score=0;state.turns=0;
    state.scored={};state.flags={vines_cleared:false,lamp_lit:false,well_bridged:false,
      temple_open:false,rope_tied:false,lighthouse_unlocked:false,lens_placed:false,
      oil_poured:false,lighthouse_lit:false,hut_searched:false,journal_read:false,parrot_fed:false,fruit_eaten:false};
    updateInv();updateScore();outputEl.innerHTML='';
    document.getElementById('text-input').disabled=false;
    document.getElementById('text-input').placeholder='Type a command...';
    addText('THE LIGHTHOUSE OF MERIDIA','victory');
    addText('Game restarted.','system');addText('','system');
    moveToRoom('beach');
    return;
  }
  if(cmd.verb==='look'&&!cmd.noun){
    const room=ROOMS[state.currentRoom];
    if(room){addText('\u2014 '+room.name+' \u2014','narration');addText(room.getDescription(),'narration');drawCurrentScene();}
    return;
  }
  if(cmd.verb==='go'){
    const room=ROOMS[state.currentRoom];
    if(!room){return;}
    const dir=cmd.noun;
    const exit=room.exits[dir];
    if(!exit){addText("You can't go that way.",'error');playError();return;}
    if(typeof exit==='string'){moveToRoom(exit);return;}
    if(typeof exit==='object'){
      if(exit.blocked){
        const flag=exit.blocked;
        if(!state.flags[flag]){addText(exit.blockedMsg||"The way is blocked.",'error');playError();return;}
      }
      moveToRoom(exit.room);return;
    }
    return;
  }
  if(cmd.verb==='save'){
    try{localStorage.setItem('meridia_save',JSON.stringify(state));addText('Game saved.','system');playSuccess();}catch(e){addText('Save failed.','error');}
    return;
  }
  if(cmd.verb==='load'||cmd.verb==='restore'){
    try{
      const data=localStorage.getItem('meridia_save');
      if(!data){addText('No saved game found.','error');return;}
      const s=JSON.parse(data);
      state.currentRoom=s.currentRoom;state.inventory=s.inventory;state.score=s.score;
      state.turns=s.turns;state.scored=s.scored;state.flags=s.flags;
      updateInv();updateScore();
      document.getElementById('text-input').disabled=false;
      document.getElementById('text-input').placeholder='Type a command...';
      const room=ROOMS[state.currentRoom];
      if(room){roomNameEl.textContent=room.name;addText('Game loaded.','system');addText('');
        addText('\u2014 '+room.name+' \u2014','narration');addText(room.getDescription(),'narration');drawCurrentScene();}
      playSuccess();
    }catch(e){addText('Load failed.','error');}
    return;
  }
  // Look at inventory items
  if(cmd.verb==='look'&&cmd.noun){
    const invDesc = getInventoryItemDesc(cmd.noun);
    if(invDesc){addText(invDesc);return;}
  }
  // Room-specific handler
  if(handleRoomCommand(cmd)) return;
  // Defaults -- in Captain Voss's voice
  const pick = arr => arr[state.turns % arr.length];
  switch(cmd.verb){
    case'take':addText(pick(["Nothing of the sort here, Captain.","Your cartographer's eye sees nothing to take.","That's not something you can pick up."]));break;
    case'use':addText(pick(["That combination doesn't accomplish anything.","Hmm, no. That doesn't work.","You turn it over in your hands, but no -- that's not useful here."]));break;
    case'look':addText(pick(["Nothing remarkable about that.","You give it a thorough look. Nothing special.","Your keen cartographer's eye finds nothing notable."]));break;
    case'talk':addText(pick(["You address the empty air. It does not reply.","There's nobody here to converse with, Captain.","Talking to yourself is a sign of too long at sea."]));break;
    case'open':case'unlock':addText("That's not something you can open.");break;
    case'read':addText("There's nothing legible here.");break;
    case'search':addText("You search thoroughly but find nothing of interest.");break;
    case'eat':addText("A captain must maintain standards. You can't eat that.");break;
    case'swim':addText("The currents are treacherous. You've sailed enough seas to know a death-trap when you see one.");break;
    case'climb':addText("There's nothing here worth climbing, and your sea legs aren't what they used to be.");break;
    case'push':case'pull':addText("You give it a good shove. Nothing happens.");break;
    case'tie':addText("There's nothing here worth tying a rope to.");break;
    case'light':addText("You can't light that. You'd need proper fuel and flame.");break;
    case'pour':addText("There's nothing here to pour.");break;
    case'cut':addText("There's nothing here that needs cutting.");break;
    case'drop':addText("A good sailor never discards useful cargo. You might need that.");break;
    case'pet':addText("There's nothing here that would appreciate being petted.");break;
    case'give':addText("There's nobody here to receive a gift.");break;
    case'answer':addText("There's no riddle to answer here. Perhaps elsewhere on the island...");break;
    default:addText('Captain Voss frowns. "'+cmd.verb+'" isn\'t in her vocabulary. Type HELP for commands.','error');break;
  }
}

function getInventoryItemDesc(noun) {
  const n = noun.replace(/\s+/g,'_');
  const aliases = {
    plank:['plank','wood','wooden plank','board'],rope:['rope','sturdy rope'],
    oil_lamp:['lamp','oil lamp','lantern'],machete:['machete','blade','rusty machete'],
    bucket:['bucket','old bucket','pail'],rusty_key:['key','rusty key','iron key'],
    flint:['flint','flint and steel','steel','flint & steel'],oil_flask:['flask','oil flask','oil','sacred oil'],
    crystal_lens:['lens','crystal','crystal lens'],exotic_fruit:['fruit','exotic fruit']
  };
  let itemId = null;
  for(const[id,names]of Object.entries(aliases)){
    if(names.includes(noun)||names.includes(n)||id===n){if(hasItem(id)){itemId=id;break;}}
  }
  if(!itemId) return null;
  const descs = {
    plank:"A sturdy wooden plank, about four feet long. Pulled from the shipwreck.",
    rope:"A length of strong hemp rope, about thirty feet long.",
    oil_lamp:state.flags.lamp_lit?"An old brass oil lamp. Its flame flickers warmly.":"An old brass oil lamp. It has oil but isn't lit yet.",
    machete:"A rusty but sharp machete. Still cuts well enough.",
    bucket:"A battered wooden bucket with a rope handle.",
    rusty_key:"A heavy iron key, covered in rust and barnacles. Looks ancient.",
    flint:"A flint stone and steel striker. Good for starting fires.",
    oil_flask:"A sealed clay flask containing sacred oil. It sloshes gently when shaken.",
    crystal_lens:"A magnificent crystal lens that seems to glow from within. It's warm to the touch.",
    exotic_fruit:"A colorful tropical fruit that smells sweet and slightly otherworldly."
  };
  if(descs[itemId]){addText(descs[itemId]);return true;}
  return null;
}

// ═══════════════════════════════════════════════════════════════════
// SCENE DRAWING FUNCTIONS (EGA Pixel Art)

// Helper functions
function drawSky(c,y1,y2,colors){
  const h=y2-y1,n=colors.length;
  for(let i=0;i<n;i++){c.fillStyle=colors[i];const sy=y1+Math.floor(i*h/n),ey=y1+Math.floor((i+1)*h/n);c.fillRect(0,sy,320,ey-sy);}
}
function drawOcean(c,y,h){
  c.fillStyle=EGA.BLUE;c.fillRect(0,y,320,h);
  for(let row=0;row<h;row+=4){
    c.fillStyle=(row%8===0)?EGA.LTBLUE:EGA.CYAN;
    for(let x=((row/4)%2)*12;x<320;x+=24){c.fillRect(x,y+row,10,2);}
  }
}
function drawCloud(c,x,y){
  c.fillStyle=EGA.WHITE;
  c.fillRect(x,y,20,4);c.fillRect(x-4,y+2,28,4);c.fillRect(x,y+4,20,2);
}
function drawPalm(c,x,y){
  c.fillStyle=EGA.BROWN;c.fillRect(x,y,4,30);c.fillRect(x+1,y+30,2,10);
  c.fillStyle=EGA.GREEN;
  c.fillRect(x-12,y-4,14,4);c.fillRect(x-16,y-8,12,4);
  c.fillRect(x+4,y-4,14,4);c.fillRect(x+8,y-8,12,4);
  c.fillRect(x-4,y-8,12,4);
  c.fillStyle=EGA.LTGREEN;
  c.fillRect(x-10,y-6,8,2);c.fillRect(x+6,y-6,8,2);
}
function drawSeagull(c,x,y){
  c.fillStyle=EGA.WHITE;c.fillRect(x,y,2,1);c.fillRect(x+3,y,2,1);c.fillRect(x+2,y+1,1,1);
}
function drawStars(c,count){
  c.fillStyle=EGA.WHITE;
  const rng=n=>{let s=n;return()=>{s=(s*16807)%2147483647;return s/2147483647;}};
  const r=rng(42);
  for(let i=0;i<count;i++){c.fillRect(Math.floor(r()*318)+1,Math.floor(r()*80)+2,1,1);}
  c.fillStyle=EGA.YELLOW;
  for(let i=0;i<count/3;i++){c.fillRect(Math.floor(r()*318)+1,Math.floor(r()*80)+2,1,1);}
}

// ── BEACH ──────────────────────────────────────────────────────
function drawBeach(c,w,h,st){
  // Sky
  drawSky(c,0,80,[EGA.LTBLUE,EGA.LTBLUE,EGA.LTCYAN,EGA.LTCYAN]);
  drawCloud(c,40,15);drawCloud(c,180,10);drawCloud(c,260,22);
  // Ocean
  drawOcean(c,80,50);
  // Beach sand
  c.fillStyle=EGA.YELLOW;c.fillRect(0,130,320,70);
  c.fillStyle=EGA.BROWN;
  for(let x=0;x<320;x+=6){if((x/6)%3===0)c.fillRect(x,130+Math.sin(x*0.1)*3,4,2);}
  // Wet sand near water
  c.fillStyle=EGA.BROWN;c.fillRect(0,128,320,4);
  // Foam line
  c.fillStyle=EGA.WHITE;
  for(let x=0;x<320;x+=8){c.fillRect(x,126+Math.sin(x*0.15)*2,6,2);}
  // Ship wreckage
  c.fillStyle=EGA.BROWN;
  c.fillRect(200,100,60,30);c.fillRect(195,110,70,20);c.fillRect(190,120,75,12);
  // Broken hull planks
  c.fillStyle=EGA.BROWN;c.fillRect(210,95,4,35);c.fillRect(230,90,4,40);c.fillRect(250,98,4,32);
  // Broken mast
  c.fillStyle=EGA.BROWN;c.fillRect(228,60,4,40);c.fillRect(226,58,8,4);
  // Torn sail
  c.fillStyle=EGA.WHITE;c.fillRect(232,62,16,20);c.fillStyle=EGA.LTGRAY;c.fillRect(232,74,16,8);
  c.fillStyle=EGA.LTGRAY;c.fillRect(244,68,8,6);
  // Rope on mast (if not taken)
  if(!st.inventory.includes('rope')){
    c.fillStyle=EGA.BROWN;c.fillRect(224,65,4,2);c.fillRect(222,67,3,2);c.fillRect(220,69,3,2);c.fillRect(218,71,4,2);c.fillRect(216,73,5,2);
  }
  // Plank in debris (if not taken)
  if(!st.inventory.includes('plank')){
    c.fillStyle=EGA.LTGRAY;c.fillRect(150,150,40,6);c.fillStyle=EGA.BROWN;c.fillRect(150,150,40,1);c.fillRect(150,155,40,1);
  }
  // Scattered debris
  c.fillStyle=EGA.BROWN;c.fillRect(120,160,8,3);c.fillRect(280,145,6,3);c.fillRect(100,170,10,2);
  // Seagulls
  drawSeagull(c,60,30);drawSeagull(c,140,20);drawSeagull(c,290,35);
  // Path indicator north
  c.fillStyle=EGA.LTGRAY;c.fillRect(145,130,30,4);c.fillRect(148,126,24,4);
  c.fillStyle=EGA.DKGRAY;c.fillRect(152,122,16,4);
  // Shells
  c.fillStyle=EGA.WHITE;c.fillRect(80,165,3,2);c.fillRect(300,168,2,2);c.fillRect(50,175,3,2);
}

  c.fillStyle=EGA.YELLOW;
  c.fillRect(290,50,30,100);
  c.fillStyle=EGA.WHITE;

  // Stalagmites
  c.fillStyle=EGA.DKGRAY;
  c.fillRect(80,170,6,10);c.fillRect(130,172,4,8);c.fillRect(190,168,5,12);
  // Water glistening
  c.fillStyle=EGA.LTBLUE;
  c.fillRect(45,60,2,2);c.fillRect(90,45,2,2);c.fillRect(180,55,2,2);c.fillRect(120,80,2,2);
  c.fillRect(70,130,2,2);c.fillRect(160,140,2,2);

  c.fillStyle=EGA.BROWN;c.fillRect(250,160,30,20);c.fillRect(230,170,20,10);

  if(st.flags.lamp_lit){

    c.fillStyle=EGA.BROWN;c.fillRect(40,50,100,120);
    c.fillStyle=EGA.YELLOW;
    c.fillRect(55,65,70,90);
    c.fillStyle=EGA.BROWN;
    c.fillRect(50,60,80,100);

    c.fillStyle=EGA.DKGRAY;
    c.fillRect(0,0,320,15);c.fillRect(0,180,320,20);c.fillRect(0,0,30,200);
    // Stalactites again
    c.fillRect(60,10,4,16);c.fillRect(100,8,3,20);
    // Natural shelf with oil flask
    c.fillStyle=EGA.LTGRAY;c.fillRect(50,100,30,6);

      c.fillStyle=EGA.BROWN;c.fillRect(58,90,8,10);c.fillStyle=EGA.YELLOW;c.fillRect(60,92,4,6);

    if(!st.flags.journal_read && !st.inventory.includes('journal')){

    // Lamp glow icon
    c.fillStyle=EGA.YELLOW;c.fillRect(140,100,6,8);c.fillStyle=EGA.WHITE;c.fillRect(141,97,4,3);

  c.fillRect(200,175,8,3);c.fillRect(160,178,6,2);c.fillRect(120,176,10,4);
}

function matchNoun(noun, ...terms) {
  if(!noun) return false;
  return terms.some(t => noun.includes(t));
}

function handleRoomCommand(cmd) {
  const room = state.currentRoom;
  const v = cmd.verb, n = cmd.noun, n2 = cmd.noun2;

  // ── UNIVERSAL ACTIONS ──
  if(v==='eat' && matchNoun(n,'fruit')){
    if(hasItem('exotic_fruit')){
      addText("You bite into the exotic fruit. It tastes like a strange mix of mango, starfruit, and regret. Interesting, but not unpleasant.");
      removeItem('exotic_fruit'); state.flags.fruit_eaten=true;
      return true;
    }
  }
  if(v==='read' && matchNoun(n,'journal')){
    if(!state.flags.journal_read){addText("You haven't found a journal to read.");return true;}
    addText("You re-read Keeper Aldric's journal:",'narration');
    addText('"The lighthouse needs three things: the Crystal Lens (in the temple), the Sacred Oil (hidden in the cave), and living flame. Relight the beacon. Guide the lost ones home."','lore');
    return true;
  }

  // ── BEACH ──
  if(room==='beach'){
    if(v==='take' && matchNoun(n,'plank','wood','board','timber')){
      if(hasItem('plank')){addText("You already have the plank.");return true;}
      addText("You pull a sturdy wooden plank from the wreckage. It's about four feet long and still solid. Could be useful!");
      addItem('plank'); addScore(5,'Found the plank'); redrawScene();
      return true;
    }
    if(v==='take' && matchNoun(n,'rope')){
      if(hasItem('rope')){addText("You already have the rope.");return true;}
      addText("You carefully untangle a length of sturdy hemp rope from the broken mast. About thirty feet of good, strong rope.");

      return true;
    }
    if(v==='look' && matchNoun(n,'ship','wreck','debris','hull')){
      addText("The remains of your ship, The Cartographer's Dream. The hull is shattered beyond repair. Broken timbers, torn sailcloth, and scattered supplies litter the beach. It won't sail again.");
      return true;
    }
    if(v==='look' && matchNoun(n,'ocean','sea','water','waves')){
      addText("The vast ocean stretches endlessly to the horizon. Somewhere out there, shipping lanes carry vessels that could rescue you... if only they could see you.");
      return true;
    }
    if(v==='swim'){
      sierraDeath("You wade bravely into the surf. The undertow grabs your legs with icy fingers and drags you under. The last thing you see is the sky, growing smaller above the dark water...", "Tip: The ocean around Meridia is treacherous. Perhaps there's another way to get rescued.");
      return true;
    }

      addText("A torn, waterlogged sail. Too damaged to be of any use.");return true;
    }
    return false;

  // ── COASTAL PATH ──

    if((v==='tie'||v==='use'||v==='attach') && matchNoun(n,'rope') && (matchNoun(n2,'ring','iron','cliff','edge')||!n2)){
      if(!hasItem('rope')){addText("You don't have a rope.");return true;}
      if(state.flags.rope_tied){addText("The rope is already securely tied to the ring.");return true;}
      addText("You thread the rope through the iron ring and tie it with a secure sailor's knot - years of seafaring have their advantages! You lower the free end over the cliff edge. It reaches all the way down to the rocks below.");
      addText("You can now climb DOWN to the lighthouse!",'success');
      state.flags.rope_tied=true; removeItem('rope'); addScore(5,'Secured the rope'); redrawScene();
      return true;
    }
    if(v==='look' && matchNoun(n,'lighthouse','tower','light')){
      addText("Far below, the lighthouse stands on a rocky promontory jutting into the sea. Its stone tower is weathered but intact. The lamp at the top is dark. If you could get down there and relight it, passing ships might see you!");
      return true;
    }
    if(v==='look' && matchNoun(n,'ring','iron')){
      addText("A sturdy iron ring, bolted deep into the rock. It's old but solid - meant for securing ropes. A few of these must have been placed by the Meridians.");
      return true;
    }
    if(v==='look' && matchNoun(n,'ocean','sea','view','horizon')){
      addText("The view is breathtaking. The ocean stretches to the horizon in every direction, deep blue fading to hazy white at the edge of the world. You can see the entire island from here - the beach where you washed ashore, the jungle canopy, and the lighthouse below.");
      return true;
    }
    if(v==='climb' && matchNoun(n,'down','cliff','rope')){
      if(!state.flags.rope_tied){sierraDeath("You attempt to climb down the sheer cliff face. For a moment, you find handholds in the rock. Then your foot slips. You tumble, bouncing off rocks, and crash onto the promontory below...", "Tip: You'll need a rope and something to secure it to before climbing down.");return true;}
      moveToRoom('lighthouse_base');return true;
    }
    if(v==='jump'){
      sierraDeath("You leap majestically off the cliff. For one glorious second, you feel like a seabird. Then gravity reminds you that you are, in fact, a cartographer.", "Tip: Jumping off cliffs is rarely the solution to any puzzle.");
      return true;
    }
    return false;
  }

  // ── LIGHTHOUSE BASE ──
  if(room==='lighthouse_base'){
    if((v==='use'||v==='unlock') && matchNoun(n,'key') && (matchNoun(n2,'door','lock','lighthouse')||!n2)){
      if(!hasItem('rusty_key')){addText("You don't have a key.");return true;}
      if(state.flags.lighthouse_unlocked){addText("The door is already unlocked.");return true;}
      addText("You insert the rusty iron key into the lock. For a heart-stopping moment, nothing happens. Then, with a grinding screech of ancient metal, the key turns!");
      addText("The heavy wooden door creaks open, revealing a spiral stone staircase winding up into the lighthouse tower!",'success');
      state.flags.lighthouse_unlocked=true; addScore(5,'Unlocked the lighthouse'); redrawScene();
      return true;
    }
    if(v==='open' && matchNoun(n,'door')){
      if(state.flags.lighthouse_unlocked){addText("The door is already open. You can ENTER the lighthouse.");return true;}
      addText("The door is locked with a heavy iron lock. You'll need a key.");
      return true;
    }
    if(v==='look' && matchNoun(n,'door','lock')){
      if(state.flags.lighthouse_unlocked) addText("The heavy wooden door stands open, revealing a spiral staircase within.");
      else addText("A heavy wooden door reinforced with iron bands. A large, rusted lock secures it. The keyhole is partially clogged with salt and grime, but a key might still work.");
      return true;
    }
    if(v==='look' && matchNoun(n,'lighthouse','tower')){
      addText("The lighthouse tower rises high above you, built from fitted stone blocks that have withstood centuries of storms. A red stripe circles the middle section. At the very top, the dark lamp housing waits to be relit.");
      return true;
    }
    if(v==='climb' && matchNoun(n,'up','rope','cliff')){
      moveToRoom('cliff_overlook');return true;
    }
    return false;
  }

  // ── HIDDEN COVE ──
  if(room==='hidden_cove'){
    if(v==='look' && matchNoun(n,'boat','rowboat','hull')){
      addText("An old wooden rowboat, sun-bleached and barnacle-encrusted. It might have been seaworthy once, but a large hole in the hull makes it useless for sailing. Still, if someone knew you were here...");
      return true;
    }
    if(v==='take' && matchNoun(n,'boat','rowboat')){
      addText("The rowboat is far too heavy to carry, and it has a massive hole in the hull anyway. You'd need another way off the island.");
      return true;
    }
    if(v==='use' && matchNoun(n,'plank') && matchNoun(n2,'boat','hull','rowboat')){
      addText("The plank isn't big enough to patch a hole that size, and you'd need tools and tar besides. You need a different plan for rescue.");
      return true;
    }
    if(v==='swim'){
      addText("The cove water is calm, but beyond the rocky entrance, powerful currents swirl. Swimming out would be suicide. You need a signal, not a swim.");
      return true;
    }
    if(v==='look' && matchNoun(n,'water','ocean','sea')){
      addText("The turquoise water in the cove is remarkably clear and calm, sheltered by the surrounding rocks. Small fish dart through the shallows. Beyond the cove entrance, the open ocean churns.");
      return true;
    }
    return false;
  }

  // ── LIGHTHOUSE TOP ──
  if(room==='lighthouse_top'){
    if((v==='use'||v==='put'||v==='place') && matchNoun(n,'lens','crystal') && (matchNoun(n2,'mechanism','socket','brass')||!n2)){
      if(!hasItem('crystal_lens')){addText("You don't have the Crystal Lens.");return true;}
      if(state.flags.lens_placed){addText("The lens is already in place.");return true;}
      addText("You carefully place the Crystal Lens into the brass socket of the mechanism. It clicks into place with a satisfying resonance, as if the mechanism has been waiting centuries for this moment. The lens shimmers with inner light.");
      state.flags.lens_placed=true; removeItem('crystal_lens'); addScore(5,'Placed the Crystal Lens'); redrawScene();
      return true;
    }
    if((v==='use'||v==='pour'||v==='put') && matchNoun(n,'oil','flask') && (matchNoun(n2,'reservoir','mechanism','tank')||!n2)){
      if(!hasItem('oil_flask')){addText("You don't have the oil.");return true;}
      if(!state.flags.lens_placed){addText("You should place the lens in the mechanism first. The oil channels connect through the lens housing.");return true;}
      if(state.flags.oil_poured){addText("The reservoir is already full.");return true;}
      addText("You break the seal on the clay flask and pour the sacred oil into the reservoir. The golden liquid flows through ancient channels in the mechanism, filling the reservoir to the brim. A faint warmth emanates from the brass.");
      state.flags.oil_poured=true; removeItem('oil_flask'); addScore(5,'Filled the oil reservoir'); redrawScene();
      return true;
    }
    if((v==='use'||v==='light') && matchNoun(n,'flint') && (matchNoun(n2,'mechanism','oil','reservoir','lamp','lighthouse','beacon')||!n2)){
      if(!hasItem('flint')){addText("You don't have the flint and steel.");return true;}
      if(!state.flags.lens_placed){addText("The mechanism isn't ready. You need to place the Crystal Lens first.");return true;}
      if(!state.flags.oil_poured){addText("There's no fuel. The oil reservoir is empty. You need to pour oil into it first.");return true;}
      if(state.flags.lighthouse_lit){addText("The lighthouse is already blazing with light!");return true;}
      // VICTORY!!!
      victorySequence();
      return true;
    }
    if(v==='light' && matchNoun(n,'mechanism','lighthouse','beacon','lamp','light')){
      if(!hasItem('flint')){addText("You need something to create a spark. Flint and steel, perhaps?");return true;}
      if(!state.flags.lens_placed){addText("The mechanism isn't ready. The lens socket is empty.");return true;}
      if(!state.flags.oil_poured){addText("The oil reservoir is dry. Without fuel, there can be no flame.");return true;}
      victorySequence();return true;
    }
    if(v==='look' && matchNoun(n,'mechanism','brass','machine','device')){
      let d = "An intricate brass mechanism, beautifully engineered by the ancient Meridians. It has a central socket for a lens, connected by channels to an oil reservoir.";
      if(state.flags.lens_placed) d+=" The Crystal Lens gleams in its socket.";
      else d+=" The lens socket is empty.";
      addText(d);return true;
    }
    if(v==='look' && matchNoun(n,'socket')){
      if(state.flags.lens_placed) addText("The Crystal Lens sits perfectly in the brass socket, glowing faintly.");
      else addText("An empty brass socket, precisely shaped to hold a lens. Intricate channels radiate outward from it.");
      return true;
    }
    if(v==='look' && matchNoun(n,'reservoir','tank','oil')){
      if(state.flags.oil_poured) addText("The reservoir is filled with sacred golden oil, ready to fuel the lighthouse flame.");
      else addText("An empty oil reservoir, connected to the main mechanism by brass channels. It's bone dry.");
      return true;
    }
    if(v==='look' && matchNoun(n,'ship','horizon','ocean','sea','window','view')){
      addText("Through the panoramic windows, you can see the vast ocean stretching to every horizon. And there - on the distant horizon to the east - a ship! Its tiny white sails are just barely visible. If you could signal it...");
      return true;
    }
    return false;
  }

  return false;
}

// ═══════════════════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', function(){
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  outputEl = document.getElementById('text-output');
  inputEl = document.getElementById('text-input');
  roomNameEl = document.getElementById('room-name');

  // Command history
  let history = [], histIdx = -1;

  inputEl.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      const val = inputEl.value.trim();
      if(val){
        history.push(val);
        if(history.length>200) history.shift();
        histIdx = history.length;
        startAmbient();
        processCommand(val);
      }
      inputEl.value = '';
      e.preventDefault();
    } else if(e.key==='ArrowUp'){
      if(history.length>0 && histIdx>0){histIdx--;inputEl.value=history[histIdx];}
      e.preventDefault();
    } else if(e.key==='ArrowDown'){
      if(histIdx<history.length-1){histIdx++;inputEl.value=history[histIdx];}
      else{histIdx=history.length;inputEl.value='';}
      e.preventDefault();
    }
  });

  // Show title screen first
  drawTitleScreen(ctx, 320, 200);
  roomNameEl.textContent = "THE LIGHTHOUSE OF MERIDIA";

  addText("THE LIGHTHOUSE OF MERIDIA",'victory');
  addText("A Sierra-Style Adventure Game",'system');
  addText("");
  addText("Salt stings your eyes. Sand grinds between your teeth. You cough seawater and drag yourself upright on a strange beach, the wreckage of your ship -- The Cartographer's Dream -- scattered across the shore behind you.",'narration');
  addText("");
  addText("You are Captain Elara Voss, cartographer. You remember the storm, the crack of the mast, the cold embrace of the sea. And now... this island.",'narration');
  addText("");
  addText("Legend speaks of the Lost Isle of Meridia, where an ancient people built an enchanted lighthouse that could guide any lost soul home. But the light went dark centuries ago, and the Meridians vanished...",'lore');
  addText("");
  addText("Find a way to relight the lighthouse and signal for rescue!",'system');
  addText("Type HELP for a list of commands. Type MAP to view the island.",'system');
  addText("");

  // Start in beach
  moveToRoom('beach');
  inputEl.focus();
});

</script>
